<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JARVIS V17.33 - TACTICAL POLICE PANEL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: #00f2ff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #side-panel { width: 360px; background: #0a0a0a; border-right: 3px solid #ff0000; padding: 20px; z-index: 1000; }
        #map-container { flex-grow: 1; position: relative; background: #000; }
        #map { width: 100%; height: 100%; }
        .header { text-align: center; border-bottom: 2px solid #ff0000; margin-bottom: 20px; padding-bottom: 10px; }
        .header h2 { margin: 0; color: #ff0000; letter-spacing: 3px; font-size: 22px; }
        .photo-box { width: 100%; height: 240px; border: 2px solid #ff0000; background: #000; overflow: hidden; margin-bottom: 15px; position: relative;}
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .info-card { background: rgba(255, 255, 255, 0.03); border-left: 4px solid #ff0000; padding: 10px; margin-bottom: 10px; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; }
        .value { font-size: 13px; color: #fff; font-weight: bold; display: block; margin-top: 3px; }
        .marker-box { position: relative; }
        .arrow-tip { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid #ff0000; }
        .ping-ring { width: 50px; height: 50px; border: 2px solid #ff0000; border-radius: 50%; position: absolute; top: -10px; left: -10px; animation: ping 1.2s infinite; }
        @keyframes ping { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
    </style>
</head>
<body>

    <div id="side-panel">
        <div class="header">
            <h2>TARGET LOCKED</h2>
            <small style="color:#39ff14;">CONNECTION: ACTIVE</small>
        </div>
        <div class="photo-box">
            <img id="d-photo" src="https://via.placeholder.com/300x200?text=SCANNING+INTEL">
        </div>
        <div class="info-card">
            <span class="label">Location Address</span>
            <span id="d-addr" class="value" style="color:#ff4d4d;">Locating Target...</span>
        </div>
        <div class="info-card">
            <span class="label">Tactical Coordinates</span>
            <span id="d-coords" class="value">0.0000000, 0.0000000</span>
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc",
          authDomain: "army-cb492.firebaseapp.com",
          databaseURL: "https://army-cb492-default-rtdb.firebaseio.com",
          projectId: "army-cb492",
          appId: "1:449848409517:web:386ad1b570731b6ec4f524"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([25.74, 82.26], 15);
        L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3']
        }).addTo(map);

        var currentMarker;

        database.ref('live_detect').on('value', (s) => {
            const d = s.val(); if(!d) return;

            // फोटो अपडेट लॉजिक
            if(d.photo) {
                document.getElementById('d-photo').src = d.photo;
            }

            // लोकेशन और मैप लोडर लॉजिक
            if(d.location) {
                var tLat = d.location.lat;
                var tLon = d.location.lon;
                document.getElementById('d-coords').innerText = tLat.toFixed(7) + ", " + tLon.toFixed(7);

                if (currentMarker) map.removeLayer(currentMarker);

                var tacticalIcon = L.divIcon({
                    className: 'marker-box',
                    html: `<div class="ping-ring"></div><div class="arrow-tip"></div>`,
                    iconSize: [30, 42], iconAnchor: [15, 42]
                });

                currentMarker = L.marker([tLat, tLon], { icon: tacticalIcon }).addTo(map);
                map.setView([tLat, tLon], 18);

                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${tLat}&lon=${tLon}`)
                .then(r=>r.json()).then(res=> document.getElementById('d-addr').innerText = res.display_name || "Machhali Shahar" );
            }
        });
    </script>
</body>
</html>
